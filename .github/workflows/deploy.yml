name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # Weekly sync every Sunday at 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy

      # The weekly scheduled sync is handled by the Worker itself via the schedule() handler.
      # This keeps the GitHub Action fast and avoids 6-hour job timeouts.

  deploy:
    needs: deploy-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      WP_PROXY_URL: ${{ vars.WP_PROXY_URL || 'https://litteratureaudio-cache.elarif-ahamada.workers.dev' }}
      WP_API_BASE: ${{ secrets.WP_API_BASE || 'https://www.litteratureaudio.com' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://litteratureaudio.pages.dev' }}
      FETCH_LIMIT: ${{ vars.FETCH_LIMIT || '5000' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter @la/web run build
        working-directory: .

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=litteratureaudio --branch=main

  mirror-mp3:
    needs: deploy-worker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MP3 mirror
        run: pnpm mirror:mp3
        env:
          WORKER_URL: https://litteratureaudio-cache.elarif-ahamada.workers.dev
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_REGION: eu-central-003
          MAX_RUNTIME_MS: "14400000" # 4h, stops cleanly before GA 6h limit
