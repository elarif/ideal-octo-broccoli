name = "litteratureaudio-cache"
main = "src/index.ts"
compatibility_date = "2024-06-14"

# D1 database binding: create via Cloudflare dashboard and paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "litteratureaudio"
database_id = "2174aacf-c66b-4409-bafe-715ff8ec6a84"

# KV namespace: create via Cloudflare dashboard and paste the id below.
[[kv_namespaces]]
binding = "KV"
id = "e7222454fde143e4810874c6281e9393"

[vars]
WP_API_BASE = "https://www.litteratureaudio.com"
# SYNC_SECRET must be set as an encrypted secret via the Cloudflare dashboard.
